[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "macllm-bench"
version = "0.1.0"
description = "Reproducible Apple Silicon LLM inference benchmarks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mlx-lm>=0.30,<1",
  "psutil>=6,<8",
]

[project.scripts]
macllm-system-info = "macllm_bench.system_info:main"
macllm-run-mlx = "macllm_bench.run_mlx:main"
macllm-context-bench = "macllm_bench.context_bench:main"
[tool.hatch.build.targets.wheel]
packages = ["src/macllm_bench"]
